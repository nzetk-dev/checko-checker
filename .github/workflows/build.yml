name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Diagnostics - show repo contents
      run: |
        echo "=== Files in repo root ==="
        Get-ChildItem -Force | Select-Object Name

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check required files
      run: |
        if (-not (Test-Path 'requirements.txt')) {
          echo "::error::requirements.txt NOT FOUND in repo root"
          exit 1
        }
        if (-not (Test-Path 'checko_checker.py')) {
          echo "::error::checko_checker.py NOT FOUND in repo root"
          exit 1
        }

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --onefile --console --name "CheckoChecker" checko_checker.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: CheckoChecker-EXE
        path: dist/CheckoChecker.exe
        retention-days: 30
