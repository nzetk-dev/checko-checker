name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name "CheckoChecker" checko_checker.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: CheckoChecker-EXE
        path: dist/CheckoChecker.exe
        retention-days: 30
